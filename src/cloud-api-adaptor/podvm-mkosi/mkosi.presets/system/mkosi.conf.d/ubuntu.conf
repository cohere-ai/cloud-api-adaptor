[Match]
Distribution=ubuntu

[Distribution]
Distribution=ubuntu
Release=noble

[Content]
CleanPackageMetadata=true
SkeletonTrees=../../resources/binaries-tree
Packages=
    linux-image-generic-hwe-24.04
    linux-headers-generic-hwe-24.04
    gcc
    make
    kmod
    udev
    util-linux
    systemd
    systemd-resolved
    dbus
    ca-certificates
    tpm2-tools
    iproute2
    iptables
    e2fsprogs
    cryptsetup
    nvidia-driver-open=595.71.05-1ubuntu1
    nvidia-persistenced=595.71.05-1ubuntu1
    nvidia-fabricmanager=595.71.05-1ubuntu1
    libnvidia-nscq=595.71.05-1ubuntu1
    nvidia-container-toolkit=1.19.0-1
    nvidia-fabricmanager-dev=595.71.05-1ubuntu1
    nvlsm
    # Remaining nvlink5-595 metapackage components that aren't already pulled in
    # above. Per the NVIDIA Fabric Manager User Guide §"Installing Fabric
    # Manager / Systems Using Fourth Generation NVSwitches", the canonical
    # B200/B300 SVM install is `apt-get install -V nvlink5-<branch>`. That
    # metapackage is now deprecated (no files, just dependencies; see
    # https://docs.nvidia.com/datacenter/tesla/driver-installation-guide/nvlink5-migration.html);
    # NVIDIA's documented migration is to install the individual components
    # explicitly. The complete dep list of nvlink5_595.71.05-1 is:
    #   libnvidia-nscq (>=595)            — already above
    #   libnvsdm (>=595)                  — added below
    #   nvidia-fabricmanager (>=595)      — already above
    #   nvidia-imex (>=595)               — added below
    #   nvidia-dkms-open / nvidia-kernel-open-dkms (>=595)  — provided by nvidia-driver-open above
    #   libnvidia-compute / nvidia-driver-cuda (>=595)      — provided by nvidia-driver-open above
    #   collectx-bringup (>=1.22.1)       — added below
    #   mft (>=4.35.0.159)                — added below
    #   mft-oem (>=4.35.0.159)            — added below
    #   mft-autocomplete (>=4.35.0.159)   — added below
    #   nvlsm (>=2025.10.12)              — already above
    #
    # Why each one matters (FM Guide §Shared NVSwitch Virtualization Model
    # and §1259 NVSwitch Errors On DGX B200/B300):
    #   libnvsdm     — NVSwitch Device Manager telemetry library; replaces
    #                  the SXID error path on B200/B300, used by FM/NVLSM
    #                  and DCGM to surface NVSwitch errors. Without it,
    #                  NVSwitch faults are invisible.
    #   nvidia-imex  — Internode Memory Exchange daemon. Manages secure
    #                  cross-OS-instance shared CUDA memory channels over
    #                  NVLink. Required for multi-tenant Shared NVSwitch
    #                  workloads where NCCL group formation registers
    #                  memory regions that cross partition boundaries;
    #                  without IMEX the GPU's secure subsystem fires
    #                  Xid 170 SECURE Fatal CROSS_CONTAIN. See fortress
    #                  scratch/oci-b200/.../docs/KNOWN-ISSUES.md §1
    #                  "mode C" for the symptom this targets.
    #   collectx-*   — UFM Telemetry / CX bringup utilities; part of the
    #                  CX bridge management plane on B200.
    #   mft / mft-oem — Mellanox Firmware Tools (mst, flint, mlxconfig,
    #                  mlxlink); needed for CX firmware diagnostics when
    #                  triaging an LPF that fails to come up.
    libnvsdm=595.71.05-1ubuntu1
    nvidia-imex=595.71.05-1ubuntu1
    collectx-bringup
    mft
    mft-oem
    mft-autocomplete
    # Userspace OFED bits that the FM User Guide "NVIDIA Software Packages"
    # section requires on B200/B300 ("OFED or MOFED package is required").
    # rdma-core pulls in libibverbs1, librdmacm1, libibmad5, libibumad3,
    # libibnetdisc5, etc. ibverbs-utils gives ibv_devices/ibv_devinfo for
    # triage. infiniband-diags below already provides ibstatus/ibstat.
    rdma-core
    ibverbs-utils
    infiniband-diags
    docker.io
    python3-minimal
    python3-pip
    curl
    iputils-ping
    pciutils
    libcurl4t64
    libxml2
    libxmlsec1-openssl
    pciutils

RemoveFiles=/etc/issue
RemoveFiles=/etc/issue.net

# Strip build-time-only artifacts after DKMS compiles nvidia modules
RemoveFiles=/usr/src/linux-headers*
RemoveFiles=/usr/src/nvidia*

# Remove for reproducible builds
RemoveFiles=/var/log
RemoveFiles=/var/cache
