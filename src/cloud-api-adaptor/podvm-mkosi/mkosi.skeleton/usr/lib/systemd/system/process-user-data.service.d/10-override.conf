[Unit]
# Wait for the TDX guest misc device before attempting RTMR extend.
Wants=sys-devices-virtual-misc-tdx_guest.device
After=sys-devices-virtual-misc-tdx_guest.device

[Service]
# mount config disk if available
ExecStartPre=-/bin/mount -t iso9660 -o ro /dev/disk/by-label/cidata /media/cidata
# Extend initdata digest into TDX RTMR 3.
# syswrite guarantees a single 48-byte write(2), which the kernel requires.
ExecStartPost=-/usr/bin/perl -e '\
  my $hex = `cat /run/peerpod/initdata.digest`; \
  chomp $hex; \
  $hex .= "0" x (96 - length($hex)); \
  open(my $rtmr, ">", "/sys/devices/virtual/misc/tdx_guest/measurements/rtmr3:sha384") or exit 0; \
  syswrite($rtmr, pack("H96", $hex)) or die "RTMR3 extend: $!";'
