[Unit]
# Wait for the TDX guest misc device before attempting RTMR extend.
Wants=sys-devices-virtual-misc-tdx_guest.device
After=sys-devices-virtual-misc-tdx_guest.device

[Service]
# mount config disk if available
ExecStartPre=-/bin/mount -t iso9660 -o ro /dev/disk/by-label/cidata /media/cidata
# Extend initdata digest into TDX RTMR 3 (runtime config / workload identity).
# The digest hex string is padded/truncated to 48 bytes (SHA-384) and written as raw binary
# to the tdx_guest sysfs measurement interface (kernel 6.17+).
ExecStartPost=-/bin/bash -c '\
  hex=$(cat /run/peerpod/initdata.digest); \
  padded=$(printf "%-96s" "$hex" | tr " " "0" | head -c96); \
  printf "$(echo "$padded" | sed "s/../\\\\x&/g")" \
    > /sys/devices/virtual/misc/tdx_guest/measurements/rtmr3:sha384'
