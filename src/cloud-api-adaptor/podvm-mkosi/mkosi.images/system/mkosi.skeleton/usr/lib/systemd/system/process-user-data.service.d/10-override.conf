[Service]
# mount config disk if available
ExecStartPre=-/bin/mount -t iso9660 -o ro /dev/disk/by-label/cidata /media/cidata
# Extend initdata digest into TDX RTMR3. Implemented as a standalone
# bash script in /usr/local/bin/extend-rtmr3-initdata; an earlier inline
# /bin/sh pipeline lost its backslash escapes through systemd+dash+sed
# parsing and wrote ASCII garbage instead of the SHA-384 digest bytes.
ExecStartPost=/usr/local/bin/extend-rtmr3-initdata
