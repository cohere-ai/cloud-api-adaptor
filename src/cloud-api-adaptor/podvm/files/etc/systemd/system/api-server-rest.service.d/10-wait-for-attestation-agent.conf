[Unit]
# api-server-rest.path only gates on the CDH socket, but `api-server-rest
# --features all` also dials the attestation-agent socket at startup. On the
# cc-nvidia image the attestation-agent (large binary + NVIDIA attester init)
# can (re)create its socket a few seconds after CDH's, so api-server-rest
# exhausts systemd's default start-rate limit (5 starts / 10s) and fails
# permanently with "Start request repeated too quickly" - leaving the
# attestation endpoint on 127.0.0.1:8006 down for the VM's whole lifetime.
# Disable the rate-limit give-up so Restart=always keeps retrying until the
# attestation-agent socket is up.
StartLimitIntervalSec=0

[Service]
# Avoid the noisy failed-start loop by blocking until both dependency sockets
# exist before launching api-server-rest.
ExecStartPre=/bin/sh -c 'until test -S /run/confidential-containers/attestation-agent/attestation-agent.sock && test -S /run/confidential-containers/cdh.sock; do sleep 0.5; done'
