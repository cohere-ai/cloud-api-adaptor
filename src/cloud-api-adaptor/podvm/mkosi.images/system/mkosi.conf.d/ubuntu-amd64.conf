[Match]
Distribution=ubuntu
Architecture=x86-64

# NVIDIA confidential GPU support. NVIDIA's APT repositories (mkosi.sandbox)
# only publish amd64 packages. The driver is built with DKMS, so the image
# needs the headers for upstream's linux-image-generic and a compiler: dkms
# only recommends gcc, and mkosi does not install recommended packages.
[Content]
Packages=
    linux-headers-generic
    gcc
    make
    nvidia-driver-580-open=580.178.04-1ubuntu1
    nvidia-persistenced=580.178.04-1ubuntu1
    nvidia-fabricmanager=580.178.04-1ubuntu1
    libnvidia-nscq=580.178.04-1ubuntu1
    nvidia-container-toolkit=1.20.0-1
    nvidia-container-toolkit-base=1.20.0-1
    libnvidia-container1=1.20.0-1
    libnvidia-container-tools=1.20.0-1

# Strip build-time-only artifacts after DKMS compiles the nvidia modules
RemoveFiles=/usr/src/linux-headers*
RemoveFiles=/usr/src/nvidia*
