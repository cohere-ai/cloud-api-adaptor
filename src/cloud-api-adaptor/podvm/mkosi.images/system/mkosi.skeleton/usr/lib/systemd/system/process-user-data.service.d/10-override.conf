[Service]
# mount config disk if available
ExecStartPre=-/bin/mount -t iso9660 -o ro /dev/disk/by-label/cidata /media/cidata
ExecStart=
ExecStart=/usr/local/bin/process-user-data provision-files
# TDX: extend initdata digest into RTMR3 (no-op / skip outside TDX).
ExecStartPost=/usr/local/bin/extend-rtmr3-initdata
# non-TDX (SEV/SNP/vTPM): upstream PCR8 bind. Soft-fail (-) if no TPM.
# Digest is hex; truncate to 32 bytes (64 hex chars) for sha256.
ExecStartPost=-/bin/bash -c 'tpm2_pcrextend 8:sha256=$(head -c64 /run/peerpod/initdata.digest)'
