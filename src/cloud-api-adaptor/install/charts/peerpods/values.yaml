# Default values for peerpods (CAA) chart

# Secret configuration
secrets:
  # How to handle provider secrets:
  #
  # - "create": Helm creates the K8s Secret from providerSecrets values.
  #   WARNING: Not recommended for production. Secrets passed via helm install
  #   are stored in Helm release history and can be retrieved with `helm get values`.
  #
  # - "reference": Reference a pre-existing K8s Secret by name.
  #   Recommended for production. Secrets are managed externally (kubectl, Vault,
  #   External Secrets Operator, etc.) and never flow through Helm.
  #
  # Future modes may include: "eso" (External Secrets Operator), "sealed" (Sealed Secrets), etc.
  #
  mode: "create"

  # Name of existing secret for provider credentials (only used when mode: "reference")
  # The secret must contain the required env var keys for your provider.
  # See providers/*-secrets.yaml.template for the list of required keys.
  existingSecretName: ""

  # Name of existing SSH key secret for providers that use SSH (libvirt, byom).
  # Only used when mode: "reference".
  # - libvirt: must contain id_rsa (private key)
  # - byom: must contain id_rsa (private key) and id_rsa.pub (public key)
  existingSshKeySecretName: ""

  # TLS certificates for CAA-to-peer-pod communication.
  #
  # TLS between CAA and agent-protocol-forwarder is always enabled. By default,
  # CAA auto-generates certificates in memory and no configuration is needed.
  #
  # To use custom certificates, two things are required:
  #
  # 1. Provide the certificate files below (create mode) or via an external
  #    secret (reference mode, see existingTlsSecretName)
  # 2. Set CACERT_FILE, CERT_FILE, CERT_KEY in providerConfigs pointing to
  #    /etc/certificates/ca.crt, client.crt, client.key respectively
  #
  # This two-step approach matches the kustomize deployment flow. A future
  # improvement may auto-derive the env vars from the certificate files.
  #
  # Three modes:
  #
  # 1. Automatic (default): Do not set CACERT_FILE/CERT_FILE/CERT_KEY in
  #    providerConfigs. CAA auto-generates certs in memory. Nothing to
  #    configure.
  #
  # 2. Custom certs, create mode (secrets.mode: "create"): Provide cert
  #    files via --set-file into secrets.tlsCerts and set the env vars in
  #    providerConfigs. Helm creates the certs-for-tls secret and mounts
  #    it at /etc/certificates.
  #
  # 3. Custom certs, reference mode (secrets.mode: "reference"): Set
  #    existingTlsSecretName to a secret you manage externally (must
  #    contain keys: ca.crt, client.crt, client.key) and set the env
  #    vars in providerConfigs. Helm only creates the volume mount.

  # Name of existing TLS secret (only used when mode: "reference")
  existingTlsSecretName: ""

  # Certificate files for custom TLS (only used when mode: "create").
  # Provide via --set-file, e.g.: --set-file secrets.tlsCerts.caCert=./ca.crt
  tlsCerts:
    caCert: ""
    clientCert: ""
    clientKey: ""

# CAA (Cloud API Adaptor) image
#
# Two image variants are published:
# - Release image (<commit>): smaller, no CGO/libvirt bindings
# - Dev image (dev-<commit> or "latest"): includes CGO bindings for libvirt/docker
#
# During development: "latest" works for all providers
# At release: most providers use <commit>, libvirt/docker use dev-<commit>
#
# Note: libvirt/docker provider files override this with the dev image.
image:
  # Cohere fork default. Published by .github/workflows/publish-cohere.yaml on
  # every push to the cohere branch. Override with a short SHA (e.g. "a4a1c915")
  # for immutable pins in production — `latest-cohere` is a floating tag and
  # follows the tip of the cohere branch.
  name: ghcr.io/cohere-ai/cloud-api-adaptor/cloud-api-adaptor
  tag: latest-cohere

# Cloud provider: libvirt, aws, azure, byom, gcp, ibmcloud, vsphere
provider: gcp

# Optional multi-provider mode. Leave empty to use the legacy single-provider
# chart behavior above. When set, the chart renders one CAA DaemonSet,
# ConfigMap, ServiceAccount/RBAC set, and RuntimeClass per provider entry.
#
# Required fields per entry:
#   name, cloudProvider, runtimeClassName, socketPath, extendedResource,
#   peerPodsLimitPerNode, probePort, vxlanPort (ports must be unique across
#   enabled providers)
# Optional: enabled (default true), config, nodeSelector, tolerations, podLabels,
#   serviceAccount.annotations, gcpWorkloadIdentity, azureWorkloadIdentity,
#   maxUnavailable, maxSurge (must remain 0)
#
# Multi-provider mode does not consume the legacy top-level provider,
# providerConfigs, command, limit, gcpWorkloadIdentity, daemonset.podLabels, or
# daemonset.serviceAccount.annotations values. Move any customizations from
# those fields into the corresponding providers[] entry before enabling this
# mode; validation rejects non-default legacy settings.
#
# With secrets.mode=create, providerSecrets.<name> supplies credentials for
# that provider's dedicated Secret. If <name> is absent, the chart falls back
# to providerSecrets.<cloudProvider> for compatibility with provider values
# files.
#
# Example:
# providers:
#   - name: gcp
#     cloudProvider: gcp
#     runtimeClassName: kata-remote-gcp
#     socketPath: /run/peerpod/caa-gcp.sock
#     extendedResource: kata.peerpods.io/vm-gcp
#     peerPodsLimitPerNode: "10"
#     probePort: 8001
#     vxlanPort: 4789
#     config:
#       GCP_PROJECT_ID: my-project
providers: []

# Extra values written to the shared peer-pods-cm in multi-provider mode for
# peerpod-ctrl. Provider configs are also unioned into that ConfigMap; if two
# providers set the same key to different values the chart fails — put shared
# keys here instead (sharedConfig wins).
sharedConfig: {}

# Override the DaemonSet container command. Set to bypass entrypoint.sh when
# using Workload Identity (no GCP_CREDENTIALS file needed).
command: ["/bin/sh", "-c", "exec cloud-api-adaptor gcp"]

# nodeSelector / tolerations applied to the cloud-api-adaptor and
# fix-gke-node-config DaemonSets. Empty by default; consumers set these
# to fence the DaemonSets onto their CAA worker pool.
nodeSelector: {}
tolerations: []

# GCP Workload Identity Federation for CAA (hostNetwork-compatible).
#
# CAA runs with hostNetwork=true, which bypasses the GKE metadata proxy. Regular
# GKE Workload Identity (the `iam.gke.io/gcp-service-account` annotation alone)
# therefore does NOT authenticate CAA as the bound GSA — it falls through to the
# node SA instead.
#
# This block wires up Workload Identity Federation via a projected SA token and
# an ADC external_account config. The GCP Go SDK (`cloud.google.com/go/auth`)
# reads the token from disk and exchanges it at STS, with no metadata server
# involvement. This path works over hostNetwork.
#
# Required on the GCP side (typically via Terraform):
#   - A workload identity pool + provider for the GKE cluster
#   - roles/iam.workloadIdentityUser on `serviceAccountEmail` for the KSA
#     principal  serviceAccount:<pool>.svc.id.goog[<ns>/cloud-api-adaptor]
#   - IAM roles on `serviceAccountEmail` for CAA's Compute API needs
#
# When enabled, this also unsets GCP_CREDENTIALS in the CAA env so the SDK
# falls through to ADC detection (which picks up GOOGLE_APPLICATION_CREDENTIALS).
gcpWorkloadIdentity:
  enabled: false
  # Full STS audience for the ADC external_account config — begins with
  # "//iam.googleapis.com/projects/...". Example:
  #   //iam.googleapis.com/projects/123456789012/locations/global/workloadIdentityPools/my-pool/providers/my-provider
  audience: ""
  # The GSA CAA should impersonate. Must have compute.instanceAdmin.v1,
  # compute.networkUser, and iam.serviceAccountUser on the project (or the
  # subset of those needed by the peer pod provisioning flow).
  serviceAccountEmail: ""
  # Audience to request in the projected SA token. For GKE's default pool this
  # is typically the same URL as `audience` (without the leading `//`), i.e.
  # "https://iam.googleapis.com/projects/..../providers/...". Leave empty to
  # derive from `audience` automatically.
  tokenAudience: ""
  # Token refresh cadence (seconds). Kubernetes caps projected SA token
  # lifetimes; 3600 is a reasonable balance between rotation and STS load.
  tokenExpirationSeconds: 3600

# GKE node config fixes. Deploys a separate DaemonSet that patches containerd
# (discard_unpacked_layers) and kubelet (runtimeRequestTimeout) on each node.
gkeNodeFix:
  enabled: true
  runtimeRequestTimeout: "15m"

# Reconciles provider-specific kata-remote containerd handlers on each node.
remoteHandlers:
  reconcileIntervalSeconds: 60
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Maximum number of peer pods allowed to run simultaneously
# This limit prevents resource exhaustion on the cloud provider
# Set to "0" for unlimited (not recommended for production)
limit: "10"

# DaemonSet configuration
daemonset:
  # Allow up to 30 minutes for peer pods on the node to become Ready.
  # The startup probe runs every 20 seconds.
  startupProbe:
    httpGet:
      path: /startup
      port: 8000
    failureThreshold: 90
    periodSeconds: 20
    initialDelaySeconds: 20
    timeoutSeconds: 1
    successThreshold: 1
  # Update strategy controls how the CAA DaemonSet performs rolling updates.
  # CAA uses hostNetwork, so two pods on the same node cause a port conflict.
  # maxSurge must be 0; roll one node at a time by killing old before starting new.
  updateStrategy:
    maxUnavailable: 1
    maxSurge: 0
  # A free-form map which can be used to inject provider-specific or platform-specific labels.
  #
  # Example (Azure Workload Identity):
  # podLabels:
  #   azure.workload.identity/use: "true"
  # NOTE:
  # - Keys may contain dots (.) and slashes (/)
  # - When setting via CLI, prefer --set-json or a values file (plain --set will interpret dots as map nesting)
  podLabels: {}

  # ServiceAccount customization for the cloud-api-adaptor daemonset.
  # For example, attach a cloud workload-identity binding via
  # serviceAccount.annotations.azure\.workload\.identity/client-id (Azure
  # Workload Identity), or the equivalent GCP / AWS annotation, so the
  # daemonset can authenticate to the cloud provider.
  serviceAccount:
    annotations: {}

# peerpod-ctrl subchart configuration
# Manages lifecycle of peer pod cloud resources and cleans up dangling VMs
# Configuration options documented in ../../../peerpod-ctrl/chart/values.yaml
resourceCtrl:
  enabled: true
  image:
    # Cohere fork default. Published by .github/workflows/publish-cohere.yaml on
    # every push to the cohere branch. Override with a short SHA for immutable
    # pins in production.
    repository: ghcr.io/cohere-ai/cloud-api-adaptor/peerpod-ctrl
    tag: latest-cohere

# peerpods-webhook subchart configuration
# Mutating webhook that modifies pod specs to use peer pods runtime and resources
# Configuration options documented in ../../../webhook/chart/values.yaml
# NOTE: Requires cert-manager to be installed in the cluster
webhook:
  enabled: true

# Fixed webhook subchart aliases for the supported hybrid GCP+Azure layout.
# Helm cannot create subchart instances dynamically from providers[], so these
# aliases are explicit. In multi-provider mode: set webhook.enabled=false and
# enable the aliases that match your RuntimeClasses, configuring
# namePrefix / namespaceOverride / webhook.targetRuntimeClass /
# webhook.podVMExtendedResource per alias.
webhookGcp:
  enabled: false
  namePrefix: peer-pods-webhook-gcp-
  namespaceOverride: peer-pods-webhook-gcp-system
  webhook:
    targetRuntimeClass: kata-remote-gcp
    podVMExtendedResource: kata.peerpods.io/vm-gcp

webhookAzure:
  enabled: false
  namePrefix: peer-pods-webhook-azure-
  namespaceOverride: peer-pods-webhook-azure-system
  webhook:
    targetRuntimeClass: kata-remote-azure
    podVMExtendedResource: kata.peerpods.io/vm-azure

# kata-deploy subchart configuration
kata-deploy:
  # Installs kata and the kata-remote RuntimeClass required by peer pods.
  # Set to false if kata is already installed (e.g., via another chart or operator).
  # If disabled, ensure kata-remote shim is enabled otherwise CAA will not work.
  enabled: true
  # Fence the kata-deploy DaemonSet to the CAA worker pool. Empty by default;
  # consumers must supply matching nodeSelector / tolerations via --set.
  nodeSelector: {}
  tolerations: []
  # No external snapshotter needed. The kata-remote shim uses
  # experimental_force_guest_pull (set in configuration-remote.toml)
  # to pull images inside the guest VM without nydus-snapshotter.
  snapshotter:
    setup: []
  defaultShim:
    amd64: remote
    arm64: remote
    s390x: remote
    ppc64le: remote
  shims:
    clh:
      enabled: false
    cloud-hypervisor:
      enabled: false
    dragonball:
      enabled: false
    fc:
      enabled: false
    qemu:
      enabled: false
    qemu-runtime-rs:
      enabled: false
    qemu-nvidia-gpu:
      enabled: false
    qemu-nvidia-gpu-snp:
      enabled: false
    qemu-nvidia-gpu-tdx:
      enabled: false
    qemu-snp:
      enabled: false
    qemu-tdx:
      enabled: false
    qemu-se:
      enabled: false
    qemu-se-runtime-rs:
      enabled: false
    qemu-cca:
      enabled: false
    qemu-coco-dev:
      enabled: false
    qemu-coco-dev-runtime-rs:
      enabled: false
    remote:
      enabled: true
      containerd:
        # Override kata-deploy's default of "nydus". nydus is not installed
        # (snapshotter.setup: [] above), so routing kata-remote to it would
        # break pod sandbox creation with
        #   "dial unix:///run/nydus-snapshotter/...: connection refused".
        # Empty string causes kata-deploy to omit the snapshotter line from
        # the containerd drop-in, letting containerd fall back to overlayfs.
        snapshotter: ""
        # Required for peer pods: sets runtime.experimental_force_guest_pull
        # = true in configuration-remote.toml so the kata-agent pulls images
        # inside the guest VM. Without this, the kata-agent tries to bind-
        # mount /run/kata-containers/shared/containers/<id>/rootfs (populated
        # by virtiofs for local kata) which doesn't exist on peer-pod VMs,
        # failing CreateContainer with ENOENT.
        forceGuestPull: true
