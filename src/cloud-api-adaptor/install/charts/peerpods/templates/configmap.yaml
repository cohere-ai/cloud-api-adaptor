{{- if not .Values.providers }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: peer-pods-cm
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: peerpods
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  CLOUD_PROVIDER: "{{ .Values.provider }}"
{{- with .Values.allowedCloudConfigAnnotations }}
  ALLOWED_CLOUD_CONFIG_ANNOTATIONS: {{ join "," . | quote }}
{{- end }}
{{- $config := dict }}
{{- if .Values.providerConfigs }}
{{- $config = index .Values.providerConfigs .Values.provider | default dict }}
{{- end }}
{{- range $key, $value := $config }}
{{- if not (and (eq $key "ALLOWED_CLOUD_CONFIG_ANNOTATIONS") $.Values.allowedCloudConfigAnnotations) }}
  {{ $key }}: "{{ $value }}"
{{- end }}
{{- end }}
{{- if .Values.tlsProfile.minVersion }}
  TLS_MIN_VERSION: "{{ .Values.tlsProfile.minVersion }}"
{{- end }}
{{- if .Values.tlsProfile.cipherSuites }}
  TLS_CIPHER_SUITES: "{{ .Values.tlsProfile.cipherSuites }}"
{{- end }}
{{- end }}
