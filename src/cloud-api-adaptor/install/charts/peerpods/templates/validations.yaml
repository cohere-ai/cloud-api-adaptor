{{- /* Multi-provider schema and identity validations. Emits no resources. */ -}}
{{- range $provider := .Values.providers }}
{{- if include "peerpods.providerEnabled" $provider }}
{{- range $field := list "name" "cloudProvider" "runtimeClassName" "socketPath" "extendedResource" }}
{{- if not (get $provider $field) }}
{{- fail (printf "providers[].%s is required for each enabled provider" $field) }}
{{- end }}
{{- end }}
{{- if not (hasKey $provider "peerPodsLimitPerNode") }}
{{- fail (printf "providers.%s.peerPodsLimitPerNode is required" $provider.name) }}
{{- end }}
{{- if and $provider.azureWorkloadIdentity $provider.azureWorkloadIdentity.enabled }}
{{- if not $provider.azureWorkloadIdentity.clientId }}
{{- fail (printf "providers.%s.azureWorkloadIdentity.clientId is required" $provider.name) }}
{{- end }}
{{- end }}
{{- if and $provider.gcpWorkloadIdentity $provider.gcpWorkloadIdentity.enabled }}
{{- if not $provider.gcpWorkloadIdentity.audience }}
{{- fail (printf "providers.%s.gcpWorkloadIdentity.audience is required" $provider.name) }}
{{- end }}
{{- if not $provider.gcpWorkloadIdentity.serviceAccountEmail }}
{{- fail (printf "providers.%s.gcpWorkloadIdentity.serviceAccountEmail is required" $provider.name) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- $azureEnabled := false }}
{{- range $provider := .Values.providers }}
{{- if and (include "peerpods.providerEnabled" $provider) $provider.azureWorkloadIdentity $provider.azureWorkloadIdentity.enabled }}
{{- $azureEnabled = true }}
{{- end }}
{{- end }}
{{- if and $azureEnabled .Values.resourceCtrl.enabled }}
{{- $annotations := ((.Values.resourceCtrl.serviceAccount | default dict).annotations) | default dict }}
{{- if not (index $annotations "azure.workload.identity/client-id") }}
{{- fail "resourceCtrl.serviceAccount.annotations.azure\\.workload\\.identity/client-id is required when Azure Workload Identity is enabled" }}
{{- end }}
{{- if ne (index (.Values.resourceCtrl.podLabels | default dict) "azure.workload.identity/use") "true" }}
{{- fail "resourceCtrl.podLabels.azure\\.workload\\.identity/use must be \"true\" when Azure Workload Identity is enabled" }}
{{- end }}
{{- end }}
