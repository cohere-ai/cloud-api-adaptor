{{- if .Values.providers }}
{{- $name := ternary "fix-gke-node-config" "configure-remote-handlers" .Values.gkeNodeFix.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $name }}
spec:
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      hostPID: true
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
{{- if .Values.gkeNodeFix.enabled }}
      - name: fix-containerd
        image: alpine:3.21
        securityContext:
          privileged: true
        volumeMounts:
        - name: host-containerd-config
          mountPath: /etc/containerd
        command:
        - /bin/sh
        - -c
        - |
          TOML=/etc/containerd/config.toml

          if grep -q 'discard_unpacked_layers = false' "$TOML"; then
            echo "containerd: already patched, skipping"
            exit 0
          fi

          if grep -q 'discard_unpacked_layers = true' "$TOML"; then
            sed -i 's/discard_unpacked_layers = true/discard_unpacked_layers = false/g' "$TOML"
            echo "containerd: patched $TOML"
            grep discard_unpacked_layers "$TOML"
            nsenter -t 1 -m -u -i -n -p -- systemctl restart containerd
            echo "containerd: restarted"
          else
            echo "containerd: discard_unpacked_layers setting not found, skipping restart"
            grep discard_unpacked_layers "$TOML" || true
          fi
      - name: fix-kubelet
        image: alpine:3.21
        securityContext:
          privileged: true
        volumeMounts:
        - name: host-kubelet-config
          mountPath: /home/kubernetes
        command:
        - /bin/sh
        - -c
        - |
          CONFIG=/home/kubernetes/kubelet-config.yaml
          DESIRED="{{ .Values.gkeNodeFix.runtimeRequestTimeout }}"

          if grep -q "runtimeRequestTimeout: \"$DESIRED\"" "$CONFIG" 2>/dev/null; then
            echo "kubelet: already set to $DESIRED, skipping"
            exit 0
          fi

          if grep -q "runtimeRequestTimeout:" "$CONFIG"; then
            sed -i "s/runtimeRequestTimeout:.*/runtimeRequestTimeout: \"$DESIRED\"/" "$CONFIG"
          else
            echo "runtimeRequestTimeout: \"$DESIRED\"" >> "$CONFIG"
          fi

          echo "kubelet: patched $CONFIG"
          grep runtimeRequestTimeout "$CONFIG"

          nsenter -t 1 -m -u -i -n -p -- systemctl restart kubelet
          echo "kubelet: restarted"
{{- end }}
      - name: install-remote-handlers
        image: alpine:3.21
        securityContext:
          privileged: true
        volumeMounts:
        - name: host-containerd-config
          mountPath: /etc/containerd
        - name: host-opt-kata
          mountPath: /opt/kata
        command:
        - /bin/sh
        - -c
        - |
          BASE=/opt/kata/share/defaults/kata-containers/runtimes/remote/configuration-remote.toml
          i=0
          while [ ! -f "$BASE" ] && [ "$i" -lt 60 ]; do
            sleep 5
            i=$((i + 1))
          done
          [ -f "$BASE" ] || { echo "base remote config missing at $BASE"; exit 1; }
{{ include "peerpods.remoteHandlerScript" . | indent 10 }}
      containers:
      - name: reconcile-remote-handlers
        image: alpine:3.21
        securityContext:
          privileged: true
        volumeMounts:
        - name: host-containerd-config
          mountPath: /etc/containerd
        - name: host-opt-kata
          mountPath: /opt/kata
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          while true; do
            BASE=/opt/kata/share/defaults/kata-containers/runtimes/remote/configuration-remote.toml
            if [ ! -f "$BASE" ]; then
              echo "base remote config missing at $BASE; retrying"
              sleep {{ .Values.remoteHandlers.reconcileIntervalSeconds | default 60 }}
              continue
            fi
{{ include "peerpods.remoteHandlerScript" . | indent 12 }}
            sleep {{ .Values.remoteHandlers.reconcileIntervalSeconds | default 60 }}
          done
      volumes:
      - name: host-containerd-config
        hostPath:
          path: /etc/containerd
          type: Directory
{{- if .Values.gkeNodeFix.enabled }}
      - name: host-kubelet-config
        hostPath:
          path: /home/kubernetes
          type: Directory
{{- end }}
      - name: host-opt-kata
        hostPath:
          path: /opt/kata
          type: DirectoryOrCreate
{{- end }}
