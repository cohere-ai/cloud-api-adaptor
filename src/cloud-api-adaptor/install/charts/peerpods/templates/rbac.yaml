{{- if not .Values.providers }}
# when owner reference is both object must be on the same namespace, hence,
# caa should have cluster-wide permissions to support any pod namespace
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloud-api-adaptor
  namespace: {{ .Release.Namespace }}
  {{- with .Values.daemonset.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-viewer
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-viewer
subjects:
- kind: ServiceAccount
  name: cloud-api-adaptor
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: pod-viewer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: peerpod-editor
rules:
- apiGroups: ["confidentialcontainers.org"]
  resources: ["peerpods"]
  verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: peerpod-editor
subjects:
- kind: ServiceAccount
  name: cloud-api-adaptor
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: peerpod-editor
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-viewer
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-viewer
subjects:
- kind: ServiceAccount
  name: cloud-api-adaptor
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: node-viewer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-status-patcher
rules:
- apiGroups: [""]
  resources: ["nodes/status"]
  verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-status-patcher
subjects:
- kind: ServiceAccount
  name: cloud-api-adaptor
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: node-status-patcher
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pp-secrets
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["delete", "create", "patch", "update", "get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pp-secrets
  namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: cloud-api-adaptor
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: pp-secrets
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cm-editor
rules:
# Create is need for initial creation of the ConfigMap. It can't
# be using resourceNames because it doesn't exist yet.
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create"]
- apiGroups: [""]
  resourceNames: ["byom-ip-pool-state"]
  resources: ["configmaps"]
  verbs: ["delete", "patch", "update", "get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cm-editor
subjects:
- kind: ServiceAccount
  name: cloud-api-adaptor
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: cm-editor
  apiGroup: rbac.authorization.k8s.io
{{- else }}
{{- range $provider := .Values.providers }}
{{- if include "peerpods.providerEnabled" $provider }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloud-api-adaptor-{{ $provider.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
{{ include "peerpods.providerLabels" (dict "root" $ "provider" $provider) | nindent 4 }}
{{ include "peerpods.providerServiceAccountAnnotations" $provider | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloud-api-adaptor-{{ $provider.name }}-pod-viewer
  labels:
{{ include "peerpods.providerLabels" (dict "root" $ "provider" $provider) | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods", "secrets", "serviceaccounts"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloud-api-adaptor-{{ $provider.name }}-pod-viewer
  labels:
{{ include "peerpods.providerLabels" (dict "root" $ "provider" $provider) | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: cloud-api-adaptor-{{ $provider.name }}
  namespace: {{ $.Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: cloud-api-adaptor-{{ $provider.name }}-pod-viewer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloud-api-adaptor-{{ $provider.name }}-peerpod-editor
  labels:
{{ include "peerpods.providerLabels" (dict "root" $ "provider" $provider) | nindent 4 }}
rules:
- apiGroups: ["confidentialcontainers.org"]
  resources: ["peerpods"]
  verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloud-api-adaptor-{{ $provider.name }}-peerpod-editor
  labels:
{{ include "peerpods.providerLabels" (dict "root" $ "provider" $provider) | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: cloud-api-adaptor-{{ $provider.name }}
  namespace: {{ $.Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: cloud-api-adaptor-{{ $provider.name }}-peerpod-editor
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloud-api-adaptor-{{ $provider.name }}-node-viewer
  labels:
{{ include "peerpods.providerLabels" (dict "root" $ "provider" $provider) | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloud-api-adaptor-{{ $provider.name }}-node-viewer
  labels:
{{ include "peerpods.providerLabels" (dict "root" $ "provider" $provider) | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: cloud-api-adaptor-{{ $provider.name }}
  namespace: {{ $.Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: cloud-api-adaptor-{{ $provider.name }}-node-viewer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloud-api-adaptor-{{ $provider.name }}-node-status-patcher
  labels:
{{ include "peerpods.providerLabels" (dict "root" $ "provider" $provider) | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["nodes/status"]
  verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloud-api-adaptor-{{ $provider.name }}-node-status-patcher
  labels:
{{ include "peerpods.providerLabels" (dict "root" $ "provider" $provider) | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: cloud-api-adaptor-{{ $provider.name }}
  namespace: {{ $.Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: cloud-api-adaptor-{{ $provider.name }}-node-status-patcher
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloud-api-adaptor-{{ $provider.name }}-pp-secrets
  namespace: {{ $.Release.Namespace }}
  labels:
{{ include "peerpods.providerLabels" (dict "root" $ "provider" $provider) | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["delete", "create", "patch", "update", "get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloud-api-adaptor-{{ $provider.name }}-pp-secrets
  namespace: {{ $.Release.Namespace }}
  labels:
{{ include "peerpods.providerLabels" (dict "root" $ "provider" $provider) | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: cloud-api-adaptor-{{ $provider.name }}
  namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: cloud-api-adaptor-{{ $provider.name }}-pp-secrets
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
{{- end }}
