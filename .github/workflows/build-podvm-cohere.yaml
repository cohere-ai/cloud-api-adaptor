name: Build PodVM Image (Cohere)

on:
  push:
    tags: ["podvm-v*"]
    branches: ["cohere"]
  workflow_dispatch:
    inputs:
      distro:
        description: "PodVM distro"
        required: false
        type: choice
        options: [ubuntu, fedora]
        default: ubuntu
      ssh_public_key:
        description: "SSH public key for debug images (optional)"
        required: false
        type: string
      deploy_gcp:
        description: "Deploy to GCP after build"
        required: false
        type: boolean
        default: true

permissions:
  id-token: write      # OIDC token for build provenance attestation
  attestations: write  # actions/attest-build-provenance
  contents: read       # actions/checkout
  packages: write      # push OCI artifact to GHCR

env:
  # tdx-nvidia selects the AA OCI tag suffix (<sha>-tdx-nvidia_x86_64) that
  # bundles libnvat.so* alongside the binary. The fork's publish-artifacts
  # workflow produces this variant; upstream guest-components does not.
  TEE_PLATFORM: tdx-nvidia
  OCI_IMAGE: ghcr.io/${{ github.repository }}/podvm
  VERSIONS_YAML: src/cloud-api-adaptor/versions.yaml
  SMOKE_MACHINE_TYPE: a3-highgpu-1g
  SMOKE_RAM_GIB: "234"
  BASELINES_REPO: cohere-ai/cohere-cc-baselines

jobs:
  meta:
    name: Compute metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      distro: ${{ steps.compute.outputs.distro }}
      class: ${{ steps.compute.outputs.class }}
      ttl: ${{ steps.compute.outputs.ttl }}
      image_name_release: ${{ steps.compute.outputs.image_name_release }}
      image_name_debug: ${{ steps.compute.outputs.image_name_debug }}
      image_tag_release: ${{ steps.compute.outputs.image_tag_release }}
      image_tag_debug: ${{ steps.compute.outputs.image_tag_debug }}
      family_release: ${{ steps.compute.outputs.family_release }}
      family_debug: ${{ steps.compute.outputs.family_debug }}
    steps:
      - name: Compute tags and image names
        id: compute
        env:
          DISTRO: ${{ inputs.distro || 'ubuntu' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Classify so consumers can pin (release/cohere) or auto-clean (dev).
          # Names are content-addressed; reruns of the same SHA get -r<attempt>.
          sha=${GITHUB_SHA:0:7}
          case "$GITHUB_REF" in
            refs/tags/podvm-v*)
              class=release; ttl=keep
              v="${GITHUB_REF#refs/tags/podvm-v}"; disc="v${v//./-}" ;;
            refs/heads/cohere)
              class=cohere; ttl=90d
              disc="$(date -u +%Y%m%d)-$sha" ;;
            *)
              class=dev; ttl=30d
              if [ -n "$PR_NUMBER" ]; then
                disc="pr$PR_NUMBER-$sha"
              else
                slug=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' \
                  | sed 's/[^a-z0-9-]/-/g; s/^-*//; s/-*$//' | cut -c1-20)
                disc="${slug:-manual}-$sha"
              fi ;;
          esac
          [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ] && disc="$disc-r$GITHUB_RUN_ATTEMPT"

          base="podvm-$DISTRO-$TEE_PLATFORM-$class"
          # GCE image names max 63 chars; deploy uses ${IMAGE_NAME}-import (7).
          # Debug names add -debug (6), so keep base-disc at 50 chars.
          max_disc_len=$((50 - ${#base} - 1))
          [ "$max_disc_len" -lt 8 ] && max_disc_len=8
          disc="${disc:0:$max_disc_len}"
          name="$base-$disc"
          tag="$class-$disc"
          {
            echo "tag=$tag"
            echo "distro=$DISTRO"
            echo "class=$class"
            echo "ttl=$ttl"
            echo "image_name_release=$name"
            echo "image_name_debug=$name-debug"
            echo "image_tag_release=$tag-$DISTRO-release"
            echo "image_tag_debug=$tag-$DISTRO-debug"
            echo "family_release=$base"
            echo "family_debug=$base-debug"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build PodVM (${{ matrix.profile }})
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [release, debug]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Free up runner disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get purge -y google-cloud-cli azure-cli microsoft-edge-stable \
            dotnet-* aspnetcore-* 2>/dev/null || true
          sudo apt-get autoremove -y
          echo "=== After cleanup ==="
          df -h /

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            alien binutils bubblewrap dnf git make mtools qemu-utils uidmap
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          command -v yq || sudo snap install yq
          yq --version

      - name: Tune kernel for mkosi
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install ORAS
        run: |
          ORAS_VERSION=$(yq '.tools.oras' "$VERSIONS_YAML")
          curl -fsSLO "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          tar -xzf "oras_${ORAS_VERSION}_linux_amd64.tar.gz" oras
          rm -f "oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          sudo mv oras /usr/local/bin/
          oras version

      - name: Install cvm-measure
        env:
          CVM_TOKEN: ${{ secrets.CVM_MEASURE_TOKEN }}
        run: |
          CVM_MEASURE_REF=$(yq -r '.git["cvm-measure"].reference' "$VERSIONS_YAML")
          CVM_MEASURE_URL=$(yq -r '.git["cvm-measure"].url' "$VERSIONS_YAML")
          git clone --depth 1 \
            "https://x-access-token:${CVM_TOKEN}@${CVM_MEASURE_URL#https://}" /tmp/cvm-measure
          git -C /tmp/cvm-measure fetch --depth 1 origin "${CVM_MEASURE_REF}"
          git -C /tmp/cvm-measure checkout "${CVM_MEASURE_REF}"
          pip install --break-system-packages /tmp/cvm-measure
          rm -rf /tmp/cvm-measure
          cvm-measure --version
          cvm-measure tdx --help | grep -q -- '--disk'

      - name: Inject SSH key for debug image
        if: matrix.profile == 'debug'
        working-directory: src/cloud-api-adaptor/podvm-mkosi
        env:
          SSH_PUBLIC_KEY: ${{ inputs.ssh_public_key || vars.DEBUG_SSH_PUBLIC_KEY }}
        run: |
          if [ -z "$SSH_PUBLIC_KEY" ]; then
            echo "No SSH public key configured, skipping"
            exit 0
          fi
          mkdir -p resources
          printf '%s\n' "$SSH_PUBLIC_KEY" > resources/authorized_keys
          chmod 0400 resources/authorized_keys
          echo "SSH key injected for debug image"

      - name: Build binaries
        working-directory: src/cloud-api-adaptor/podvm-mkosi
        env:
          GH_TOKEN: ${{ github.token }}
          PODVM_DISTRO: ${{ needs.meta.outputs.distro }}
        run: |
          make \
            VERIFY_PROVENANCE=yes \
            TEE_PLATFORM="$TEE_PLATFORM" \
            PODVM_DISTRO="$PODVM_DISTRO" \
            binaries
          docker system prune -af --volumes 2>/dev/null || true
          echo "Disk after binaries build:"
          df -h /

      - name: Build OS image
        working-directory: src/cloud-api-adaptor/podvm-mkosi
        env:
          PROFILE: ${{ matrix.profile }}
          PODVM_DISTRO: ${{ needs.meta.outputs.distro }}
        run: |
          TARGET="image"
          if [ "$PROFILE" = "debug" ]; then
            TARGET="image-debug"
          fi
          TEE_PLATFORM="$TEE_PLATFORM" \
          PODVM_DISTRO="$PODVM_DISTRO" \
          make "$TARGET"

          ls -lh build/

      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          mv src/cloud-api-adaptor/podvm-mkosi/build/system.raw /tmp/disk.raw
          docker system prune -af --volumes 2>/dev/null || true
          echo "=== After cleanup ==="
          df -h /

      - name: Extract UKI and predict TDX measurements
        id: measure
        env:
          GH_TOKEN: ${{ secrets.CVM_MEASURE_TOKEN }}
          IMAGE_NAME: ${{ matrix.profile == 'release' && needs.meta.outputs.image_name_release || needs.meta.outputs.image_name_debug }}
          IMAGE_FAMILY: ${{ matrix.profile == 'release' && needs.meta.outputs.family_release || needs.meta.outputs.family_debug }}
          IMAGE_CLASS: ${{ needs.meta.outputs.class }}
          IMAGE_TTL: ${{ needs.meta.outputs.ttl }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CAA_COMMIT: ${{ github.sha }}
          CAA_REF: ${{ github.ref_name }}
          DISTRO: ${{ needs.meta.outputs.distro }}
          PROFILE: ${{ matrix.profile }}
        run: |
          cvm-measure extract-uki --disk /tmp/disk.raw --output /tmp/BOOTX64.EFI

          mkdir -p /tmp/cvm-artifacts
          BASELINE="/tmp/cvm-artifacts/${SMOKE_MACHINE_TYPE}.json"
          gh api "/repos/${BASELINES_REPO}/contents/baselines/gcp/tdx/${SMOKE_MACHINE_TYPE}.json" \
            --jq .content | base64 -d > "$BASELINE"

          FIRMWARE_SHA384=$(jq -r '.firmware_sha384' "$BASELINE")
          FIRMWARE="/tmp/cvm-artifacts/${FIRMWARE_SHA384}.fd"
          curl -fsSL \
            "https://storage.googleapis.com/gce_tcb_integrity/ovmf_x64_csm/${FIRMWARE_SHA384}.fd" \
            -o "$FIRMWARE"

          cvm-measure tdx \
            --firmware "$FIRMWARE" \
            --uki /tmp/BOOTX64.EFI \
            --baseline "$BASELINE" \
            --disk /tmp/disk.raw \
            --ram "$SMOKE_RAM_GIB" \
            --output-format json > /tmp/tdx-measurements.json

          jq -e 'has("mrtd") and has("rtmr0") and has("rtmr1") and has("rtmr2") and has("rtmr3")' \
            /tmp/tdx-measurements.json
          RTMR2=$(jq -r '.rtmr2' /tmp/tdx-measurements.json)

          KERNEL=$(python3 -c "
          from cvm_measure.tdx.pe import pe_extract_section
          data = pe_extract_section(open('/tmp/BOOTX64.EFI','rb').read(), '.uname', use_virtual_size=True)
          print(data.decode(errors='replace').strip('\x00') if data else 'unknown')
          ")

          # NVIDIA driver version is pinned in the distro mkosi package list
          # (e.g. `nvidia-driver-580-open=580.159.04-1ubuntu1`). Surface the
          # `epoch:upstream-debian` portion so downstream tooling (model-integrity
          # kata-policy) can bind attestation to a specific driver build.
          DISTRO_CONF="src/cloud-api-adaptor/podvm-mkosi/mkosi.images/system/mkosi.conf.d/${DISTRO}.conf"
          if [ ! -f "$DISTRO_CONF" ]; then
            echo "ERROR: mkosi distro config not found: $DISTRO_CONF" >&2
            exit 1
          fi

          NVIDIA_DRIVER_PKG=$(awk -F= '
            /^[[:space:]]*nvidia-driver-[0-9]+(-open)?[[:space:]]*=/ {
              gsub(/[[:space:]]/,"",$1); gsub(/[[:space:]]/,"",$2);
              print $1 "=" $2; exit
            }' "$DISTRO_CONF")
          if [ "$DISTRO" = "ubuntu" ] && [ -z "$NVIDIA_DRIVER_PKG" ]; then
            echo "ERROR: could not extract nvidia-driver-* pin from $DISTRO_CONF" >&2
            exit 1
          fi
          NVIDIA_DRIVER_VERSION=""
          if [ -n "$NVIDIA_DRIVER_PKG" ]; then
            NVIDIA_DRIVER_VERSION="${NVIDIA_DRIVER_PKG#*=}"
            echo "nvidia driver: $NVIDIA_DRIVER_PKG"
          else
            echo "No nvidia-driver-* pin found in $DISTRO_CONF; omitting NVIDIA driver metadata"
          fi

          jq -n \
            --arg image_name "$IMAGE_NAME" \
            --arg image_family "$IMAGE_FAMILY" \
            --arg image_class "$IMAGE_CLASS" \
            --arg image_ttl "$IMAGE_TTL" \
            --arg pr_number "$PR_NUMBER" \
            --slurpfile tdx /tmp/tdx-measurements.json \
            --arg smoke_machine_type "$SMOKE_MACHINE_TYPE" \
            --arg smoke_ram_gib "$SMOKE_RAM_GIB" \
            --arg rtmr2_sha384 "$RTMR2" \
            --arg kernel "$KERNEL" \
            --arg nvidia_driver_pkg "$NVIDIA_DRIVER_PKG" \
            --arg nvidia_driver_version "$NVIDIA_DRIVER_VERSION" \
            --arg caa_commit "$CAA_COMMIT" \
            --arg caa_ref "$CAA_REF" \
            --arg caa_version "$CAA_REF" \
            --arg distro "$DISTRO" \
            --arg profile "$PROFILE" \
            --arg tee_platform "$TEE_PLATFORM" \
            --arg build_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '$ARGS.named + $tdx[0]
             | .smoke_machine_type = $smoke_machine_type
             | .smoke_ram_gib = ($smoke_ram_gib | tonumber)
             | if .nvidia_driver_version == "" then
                 del(.nvidia_driver_pkg, .nvidia_driver_version)
               else
                 .
               end
             | if .pr_number == "" then del(.pr_number) else . end' > /tmp/measurements.json

          cat /tmp/measurements.json

      - name: Prepare artifacts
        run: |
          tar -czf /tmp/disk.tar.gz -C /tmp disk.raw
          rm /tmp/disk.raw
          echo "Compressed size: $(du -sh /tmp/disk.tar.gz | cut -f1)"

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push artifact to GHCR
        id: push
        env:
          OCI_TAG: ${{ matrix.profile == 'release' && needs.meta.outputs.image_tag_release || needs.meta.outputs.image_tag_debug }}
          IMAGE_TITLE: ${{ matrix.profile == 'release' && needs.meta.outputs.image_name_release || needs.meta.outputs.image_name_debug }}
          DISTRO: ${{ needs.meta.outputs.distro }}
          PROFILE: ${{ matrix.profile }}
          CAA_COMMIT: ${{ github.sha }}
        run: |
          OCI_REF="${OCI_IMAGE}:${OCI_TAG}"
          RTMR2=$(jq -r '.rtmr2_sha384' /tmp/measurements.json)
          NVIDIA_DRIVER_VERSION=$(jq -r '.nvidia_driver_version // ""' /tmp/measurements.json)

          cd /tmp
          ANNOTATIONS=(
            --annotation "org.opencontainers.image.title=${IMAGE_TITLE}"
            --annotation "org.opencontainers.image.description=PodVM OS image (${DISTRO}/${TEE_PLATFORM}/${PROFILE})"
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}"
            --annotation "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --annotation "com.cohere.caa.commit=${CAA_COMMIT}"
            --annotation "com.cohere.caa.version=${GITHUB_REF_NAME}"
            --annotation "com.cohere.rtmr2=${RTMR2}"
          )
          if [ -n "$NVIDIA_DRIVER_VERSION" ]; then
            ANNOTATIONS+=(--annotation "com.cohere.nvidia.driver_version=${NVIDIA_DRIVER_VERSION}")
          fi

          oras push "$OCI_REF" \
            disk.tar.gz:application/vnd.cohere.podvm.disk.tar+gzip \
            measurements.json:application/vnd.cohere.podvm.measurements+json \
            "${ANNOTATIONS[@]}" \
            --format json > oras-output.json

          cat oras-output.json
          DIGEST=$(jq -r '.digest' oras-output.json)

          {
            echo "digest=$DIGEST"
            echo "oci_ref=${OCI_REF}@${DIGEST}"
            echo "oci_tag=$OCI_TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Pushed: $OCI_REF @ $DIGEST"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-name: ${{ env.OCI_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ---------------------------------------------------------------------------
  # Deploy to GCP — release & debug images
  # ---------------------------------------------------------------------------
  deploy-gcp:
    name: Deploy ${{ matrix.profile }} to GCP
    needs: [meta, build]
    if: |
      needs.build.result == 'success' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy_gcp))
    strategy:
      fail-fast: false
      matrix:
        profile: [release, debug]
    uses: ./.github/workflows/deploy-gcp-cohere.yaml
    with:
      image_tag: ${{ needs.meta.outputs.tag }}-${{ needs.meta.outputs.distro }}-${{ matrix.profile }}
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

  smoke-gcp-tdx:
    name: Smoke TDX measurements (GCP debug image)
    needs: [meta, deploy-gcp]
    if: |
      needs.deploy-gcp.result == 'success' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy_gcp))
    uses: ./.github/workflows/smoke-gcp-tdx.yaml
    with:
      image_tag: ${{ needs.meta.outputs.image_tag_debug }}
      image_name: ${{ needs.meta.outputs.image_name_debug }}
      machine_type: a3-highgpu-1g
      ram_gib: "234"
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      CVM_MEASURE_TOKEN: ${{ secrets.CVM_MEASURE_TOKEN }}
      DEBUG_SSH_PRIVATE_KEY: ${{ secrets.DEBUG_SSH_PRIVATE_KEY }}
