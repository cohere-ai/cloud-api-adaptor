name: Smoke TDX Measurements (GCP)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "PodVM OCI artifact tag in GHCR"
        required: true
        type: string
      image_name:
        description: "GCE image name to boot"
        required: true
        type: string
      measurements_run_id:
        description: "Workflow run ID containing the smoke-measurements artifact"
        required: true
        type: string
      image_project:
        description: "GCP project containing the image"
        required: false
        type: string
        default: cohere-artifacts
      gcp_project:
        description: "GCP project where the smoke VM is created"
        required: false
        type: string
        default: cohere-confidential-computing
      zone:
        description: "GCP zone for the smoke VM"
        required: false
        type: string
        default: us-central1-a
      machine_type:
        description: "GCE machine type; must match measurements.json"
        required: false
        type: string
        default: a3-highgpu-1g
      network:
        description: "GCP VPC network for the smoke VM"
        required: false
        type: string
        default: conf-compute
      subnet:
        description: "GCP subnet for the smoke VM"
        required: false
        type: string
        default: conf-compute-subnet
      ram_gib:
        description: "Guest RAM in GiB; must match measurements.json"
        required: false
        type: string
        default: "234"
  workflow_call:
    inputs:
      image_tag:
        description: "PodVM OCI artifact tag in GHCR"
        required: true
        type: string
      image_name:
        description: "GCE image name to boot"
        required: true
        type: string
      image_project:
        description: "GCP project containing the image"
        required: false
        type: string
        default: cohere-artifacts
      gcp_project:
        description: "GCP project where the smoke VM is created"
        required: false
        type: string
        default: cohere-confidential-computing
      zone:
        description: "GCP zone for the smoke VM"
        required: false
        type: string
        default: us-central1-a
      machine_type:
        description: "GCE machine type; must match measurements.json"
        required: false
        type: string
        default: a3-highgpu-1g
      network:
        description: "GCP VPC network for the smoke VM"
        required: false
        type: string
        default: conf-compute
      subnet:
        description: "GCP subnet for the smoke VM"
        required: false
        type: string
        default: conf-compute-subnet
      ram_gib:
        description: "Guest RAM in GiB; must match measurements.json"
        required: false
        type: string
        default: "234"
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_SERVICE_ACCOUNT:
        required: true
      CVM_MEASURE_TOKEN:
        required: true
      DEBUG_SSH_PRIVATE_KEY:
        required: true

permissions: {}

env:
  OCI_IMAGE: ghcr.io/${{ github.repository }}/podvm
  VERSIONS_YAML: src/cloud-api-adaptor/versions.yaml

jobs:
  smoke:
    name: Boot and compare TDX measurements
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GCP Workload Identity Federation.
      actions: read   # Download smoke measurements artifact from this run.
      contents: read  # Checkout repository contents.
      packages: read  # Pull PodVM OCI artifacts from GHCR.
      attestations: read # gh attestation verify
    concurrency:
      group: smoke-gcp-tdx-${{ inputs.image_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Download smoke measurements
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smoke-measurements-${{ inputs.image_name }}
          path: /tmp/podvm

      - name: Download smoke measurements from prior run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smoke-measurements-${{ inputs.image_name }}
          path: /tmp/podvm
          run-id: ${{ inputs.measurements_run_id }}
          github-token: ${{ github.token }}

      - name: Install ORAS and cvm-measure
        env:
          CVM_TOKEN: ${{ secrets.CVM_MEASURE_TOKEN }}
        run: |
          command -v yq || sudo snap install yq
          ORAS_VERSION=$(yq '.tools.oras' "$VERSIONS_YAML")
          curl -fsSLO "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          tar -xzf "oras_${ORAS_VERSION}_linux_amd64.tar.gz" oras
          sudo mv oras /usr/local/bin/
          rm -f "oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          oras version

          CVM_MEASURE_REF=$(yq -r '.git["cvm-measure"].reference' "$VERSIONS_YAML")
          CVM_MEASURE_URL=$(yq -r '.git["cvm-measure"].url' "$VERSIONS_YAML")
          git clone --depth 1 \
            "https://x-access-token:${CVM_TOKEN}@${CVM_MEASURE_URL#https://}" /tmp/cvm-measure
          git -C /tmp/cvm-measure fetch --depth 1 origin "${CVM_MEASURE_REF}"
          git -C /tmp/cvm-measure checkout "${CVM_MEASURE_REF}"
          pip install --break-system-packages /tmp/cvm-measure
          rm -rf /tmp/cvm-measure
          cvm-measure --version
          cvm-measure tdx --help | grep -q -- '--disk'

      - name: Pull measurements artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_NAME: ${{ inputs.image_name }}
          MACHINE_TYPE: ${{ inputs.machine_type }}
          RAM_GIB: ${{ inputs.ram_gib }}
        run: |
          echo "$GITHUB_TOKEN" | oras login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

          IMAGE_DIGEST=$(oras resolve "${OCI_IMAGE}:${IMAGE_TAG}")
          IMAGE_REF="${OCI_IMAGE}@${IMAGE_DIGEST}"
          gh attestation verify "oci://${IMAGE_REF}" \
            --repo "${GITHUB_REPOSITORY}"

          mkdir -p /tmp/podvm
          cd /tmp/podvm
          oras pull "${IMAGE_REF}"
          jq -e \
            --arg image_name "$IMAGE_NAME" \
            '.image_name == $image_name
             and has("rtmr2_sha384")
             and (has("mrtd") | not)
             and (has("rtmr0") | not)
             and (has("rtmr1") | not)
             and (has("rtmr3") | not)' \
            /tmp/podvm/measurements.json
          cat /tmp/podvm/measurements.json

          jq -e \
            --arg image_name "$IMAGE_NAME" \
            --arg machine_type "$MACHINE_TYPE" \
            --argjson ram_gib "$RAM_GIB" \
            '.image_name == $image_name
             and .smoke_machine_type == $machine_type
             and .smoke_ram_gib == $ram_gib
             and has("mrtd") and has("rtmr0") and has("rtmr1") and has("rtmr2") and has("rtmr3")' \
            /tmp/podvm/smoke-measurements.json

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Boot smoke VM
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_PROJECT: ${{ inputs.image_project }}
          GCP_PROJECT: ${{ inputs.gcp_project }}
          ZONE: ${{ inputs.zone }}
          MACHINE_TYPE: ${{ inputs.machine_type }}
          NETWORK: ${{ inputs.network }}
          SUBNET: ${{ inputs.subnet }}
          DEBUG_SSH_PRIVATE_KEY: ${{ secrets.DEBUG_SSH_PRIVATE_KEY }}
        run: |
          VM_NAME="podvm-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "VM_NAME=$VM_NAME" >> "$GITHUB_ENV"

          install -m 0700 -d ~/.ssh
          printf '%s\n' "$DEBUG_SSH_PRIVATE_KEY" > ~/.ssh/podvm_smoke
          chmod 0600 ~/.ssh/podvm_smoke

          cat > /tmp/podvm-smoke-user-data.yaml <<'EOF'
          #cloud-config
          write_files:
          - path: /run/peerpod/aa.toml
            content: ""
          EOF
          base64 -w0 /tmp/podvm-smoke-user-data.yaml > /tmp/podvm-smoke-user-data.b64

          gcloud compute instances create "$VM_NAME" \
            --project="$GCP_PROJECT" \
            --zone="$ZONE" \
            --machine-type="$MACHINE_TYPE" \
            --network="$NETWORK" \
            --subnet="$SUBNET" \
            --image="$IMAGE_NAME" \
            --image-project="$IMAGE_PROJECT" \
            --confidential-compute-type=TDX \
            --provisioning-model=SPOT \
            --instance-termination-action=DELETE \
            --maintenance-policy=TERMINATE \
            --shielded-vtpm \
            --no-service-account \
            --no-scopes \
            --metadata-from-file=user-data=/tmp/podvm-smoke-user-data.b64 \
            --labels=purpose=podvm-smoke,github-run-id="${GITHUB_RUN_ID}"

      - name: Fetch AA evidence and CC event log
        env:
          GCP_PROJECT: ${{ inputs.gcp_project }}
          ZONE: ${{ inputs.zone }}
        run: |
          SSH_BASE=(
            ssh
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=10
            -o ProxyCommand="gcloud compute start-iap-tunnel ${VM_NAME} 22 --listen-on-stdin --zone=${ZONE} --project=${GCP_PROJECT}"
            -i ~/.ssh/podvm_smoke
            root@compute.0
          )

          for _ in $(seq 1 60); do
            if "${SSH_BASE[@]}" 'true' >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          "${SSH_BASE[@]}" 'true'

          runtime_data=$(printf 'podvm-smoke-%s' "$GITHUB_RUN_ID" | base64 -w0)
          for _ in $(seq 1 60); do
            if "${SSH_BASE[@]}" \
              "curl -fsS 'http://127.0.0.1:8006/aa/evidence?runtime_data=${runtime_data}&encoding=base64'" \
              > /tmp/aa-evidence.json; then
              break
            fi
            sleep 10
          done
          if [ ! -s /tmp/aa-evidence.json ]; then
            "${SSH_BASE[@]}" 'systemctl --no-pager --full status attestation-agent confidential-data-hub || true'
            "${SSH_BASE[@]}" 'journalctl --no-pager -u attestation-agent -u confidential-data-hub -n 200 || true'
            exit 1
          fi
          "${SSH_BASE[@]}" 'nvidia-smi -L'

          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path

          evidence = json.loads(Path("/tmp/aa-evidence.json").read_text())

          def find_key(obj, key):
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      if k == key:
                          return v
                      found = find_key(v, key)
                      if found is not None:
                          return found
              elif isinstance(obj, list):
                  for item in obj:
                      found = find_key(item, key)
                      if found is not None:
                          return found
              return None

          quote_b64 = find_key(evidence, "quote")
          ccel_b64 = find_key(evidence, "cc_eventlog")
          if not quote_b64 or not ccel_b64:
              raise SystemExit("AA evidence did not include quote and cc_eventlog")

          Path("/tmp/tdx-quote.bin").write_bytes(base64.b64decode(quote_b64))
          Path("/tmp/ccel.bin").write_bytes(base64.b64decode(ccel_b64))
          PY

      - name: Compare expected and runtime measurements
        run: |
          cvm-measure tdx replay --ccel /tmp/ccel.bin > /tmp/runtime-rtmrs.txt
          cat /tmp/runtime-rtmrs.txt

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          expected = json.loads(Path("/tmp/podvm/smoke-measurements.json").read_text())
          quote = Path("/tmp/tdx-quote.bin").read_bytes()
          replay = Path("/tmp/runtime-rtmrs.txt").read_text()
          runtime = dict(re.findall(r"^(rtmr[0-3]):\s*([0-9a-f]{96})$", replay, re.M))

          errors = []
          for key in ("rtmr0", "rtmr1", "rtmr2", "rtmr3"):
              if runtime.get(key) != expected[key]:
                  errors.append(f"{key}: expected {expected[key]}, got {runtime.get(key)}")

          # The quote is the AA-produced object used by ITA. Assert the full
          # expected values are present in it without relying on DCAP offsets.
          for key in ("mrtd", "rtmr0", "rtmr1", "rtmr2", "rtmr3"):
              needle = bytes.fromhex(expected[key])
              if needle not in quote:
                  errors.append(f"{key}: expected value not found in AA quote")

          if errors:
              raise SystemExit("Measurement comparison failed:\n" + "\n".join(errors))

          print("TDX measurements match cvm-measure expectations")
          PY

      - name: Delete smoke VM
        if: always()
        env:
          GCP_PROJECT: ${{ inputs.gcp_project }}
          ZONE: ${{ inputs.zone }}
        run: |
          if [ -n "${VM_NAME:-}" ]; then
            gcloud compute instances delete "$VM_NAME" \
              --project="$GCP_PROJECT" \
              --zone="$ZONE" \
              --quiet || true
          fi
