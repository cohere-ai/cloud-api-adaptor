name: Deploy PodVM to Azure (Cohere)

# Publishes a podvm artifact to an Azure Compute Gallery image version flagged
# ConfidentialVmSupported (x86_64/Gen2) for SEV-SNP VMs (e.g. NCCadsH100v5).
# Uses uplosi (same tool as upstream azure-podvm-image-build) to MiB-align the
# raw disk, upload via managed disk, and create the gallery image version.
# Requires (infra-azure):
#   secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (OIDC app
#            with Contributor on the gallery resource group)
#   vars:    AZURE_RESOURCE_GROUP, AZURE_PODVM_GALLERY_NAME, AZURE_LOCATION

on:
  workflow_call:
    inputs:
      image_tag:
        description: "OCI artifact tag in GHCR to deploy"
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

  workflow_dispatch:
    inputs:
      image_tag:
        description: "OCI artifact tag in GHCR to deploy"
        required: true
        type: string

permissions: {}

env:
  OCI_IMAGE: ghcr.io/${{ github.repository }}/podvm
  VERSIONS_YAML: src/cloud-api-adaptor/versions.yaml
  ORAS_SHA256: "5b3f1cbb86d869eee68120b9b45b9be983f3738442f87ee5f06b00edd0bab336"
  UPLOSI_VERSION: "0.3.0"
  UPLOSI_SHA256: "687bcab7398ab0fda65a3809492e8cd4d6a25aad1573927be5ec75ac1c4cbc35"

jobs:
  deploy:
    name: Azure
    runs-on: ubuntu-latest
    # Serialize all gallery publishes. Image versions are immutable and keyed by
    # image definition, which is only known after reading measurements.json.
    concurrency:
      group: deploy-azure-cohere-gallery-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      id-token: write      # Azure login via OIDC federated credentials
      contents: read       # actions/checkout
      packages: read       # pull OCI artifact from GHCR
      attestations: read   # gh attestation verify
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          command -v yq || sudo snap install yq
          ORAS_VERSION=$(yq '.tools.oras' "$VERSIONS_YAML")
          curl -fsSLO "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          sha256sum -c <(echo "$ORAS_SHA256  oras_${ORAS_VERSION}_linux_amd64.tar.gz")
          tar -xzf "oras_${ORAS_VERSION}_linux_amd64.tar.gz" oras
          sudo mv oras /usr/local/bin/
          oras version

          wget -q "https://github.com/edgelesssys/uplosi/releases/download/v${UPLOSI_VERSION}/uplosi_${UPLOSI_VERSION}_linux_amd64.tar.gz"
          sha256sum -c <(echo "$UPLOSI_SHA256  uplosi_${UPLOSI_VERSION}_linux_amd64.tar.gz")
          tar xzf "uplosi_${UPLOSI_VERSION}_linux_amd64.tar.gz" uplosi
          sudo mv uplosi /usr/local/bin/
          uplosi -v

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify attestation
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          IMAGE_DIGEST=$(oras resolve "${OCI_IMAGE}:${IMAGE_TAG}")
          IMAGE_REF="${OCI_IMAGE}@${IMAGE_DIGEST}"
          gh attestation verify \
            "oci://${IMAGE_REF}" \
            --repo "${GITHUB_REPOSITORY}"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "Attestation verified for ${IMAGE_REF}"

      - name: Pull artifact and read measurements
        id: pull
        env:
          IMAGE_REF: ${{ steps.verify.outputs.image_ref }}
        run: |
          mkdir -p /tmp/podvm
          cd /tmp/podvm
          oras pull "${IMAGE_REF}"
          ls -lh

          if [ ! -f measurements.json ]; then
            echo "ERROR: measurements.json not found in artifact - build is broken"
            exit 1
          fi
          cat measurements.json

          IMAGE_NAME=$(jq -r '.image_name' measurements.json)
          IMAGE_FAMILY=$(jq -r '.image_family // ""' measurements.json)
          if [ -z "$IMAGE_NAME" ] || [ "$IMAGE_NAME" = "null" ] || [ -z "$IMAGE_FAMILY" ]; then
            echo "ERROR: image_name/image_family missing in measurements.json" >&2
            exit 1
          fi

          # Definition names: [A-Za-z0-9._-], <=80 chars.
          IMAGE_DEF=$(echo "$IMAGE_FAMILY" | sed 's/[^A-Za-z0-9._-]/-/g' | cut -c1-80)

          # Versions need numeric Major.Minor.Patch, no leading zeros. Use
          # epoch seconds as patch so same-minute retries do not collide.
          MAJOR=$(date -u +%Y)
          MINOR=$(date -u +%m%d | sed 's/^0*//'); MINOR=${MINOR:-0}
          PATCH=$(($(date -u +%s) + ${GITHUB_RUN_ATTEMPT:-1}))
          IMAGE_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          TEE_PLATFORM=$(jq -r '.tee_platform // "sev"' measurements.json)
          case "$TEE_PLATFORM" in
            tdx|az-tdx|azure-tdx) ATTESTATION_VARIANT=azure-tdx ;;
            sev|sev-snp|snp|az-cvm-vtpm|azure-sev-snp) ATTESTATION_VARIANT=azure-sev-snp ;;
            *)
              echo "WARN: unknown tee_platform='$TEE_PLATFORM'; defaulting attestationVariant=azure-sev-snp" >&2
              ATTESTATION_VARIANT=azure-sev-snp
              ;;
          esac

          {
            echo "image_name=$IMAGE_NAME"
            echo "image_def=$IMAGE_DEF"
            echo "image_version=$IMAGE_VERSION"
            echo "tee_platform=$TEE_PLATFORM"
            echo "attestation_variant=$ATTESTATION_VARIANT"
            echo "distro=$(jq -r '.distro' measurements.json)"
            echo "profile=$(jq -r '.profile' measurements.json)"
            echo "caa_commit=$(jq -r '.caa_commit' measurements.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Extract raw disk
        run: |
          cd /tmp/podvm
          tar -xzf disk.tar.gz
          ls -lh disk.raw

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish confidential gallery image version
        env:
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          GALLERY: ${{ vars.AZURE_PODVM_GALLERY_NAME }}
          LOCATION: ${{ vars.AZURE_LOCATION }}
          IMAGE_DEF: ${{ steps.pull.outputs.image_def }}
          IMAGE_VERSION: ${{ steps.pull.outputs.image_version }}
          TEE_PLATFORM: ${{ steps.pull.outputs.tee_platform }}
          ATTESTATION_VARIANT: ${{ steps.pull.outputs.attestation_variant }}
        run: |
          set -euo pipefail
          for v in SUBSCRIPTION_ID RESOURCE_GROUP GALLERY LOCATION; do
            if [ -z "${!v}" ]; then
              echo "ERROR: required Azure var/secret '$v' is empty - configure the infra-azure prerequisites" >&2
              exit 1
            fi
          done

          # Disk / managed-image names must be unique per upload and Azure-safe.
          DISK_NAME=$(echo "${IMAGE_DEF}-${IMAGE_VERSION}" | sed 's/[^A-Za-z0-9._-]/-/g' | cut -c1-80)

          # Write unindented TOML (uplosi config parser is whitespace-sensitive on tables).
          cat > /tmp/podvm/uplosi.conf <<EOF
          [base]
          imageVersion = "${IMAGE_VERSION}"
          name = "${IMAGE_DEF}"

          [base.azure]
          subscriptionID = "${SUBSCRIPTION_ID}"
          location = "${LOCATION}"
          resourceGroup = "${RESOURCE_GROUP}"
          sharedImageGallery = "${GALLERY}"
          sharingProfile = "private"
          attestationVariant = "${ATTESTATION_VARIANT}"
          imageDefinitionName = "${IMAGE_DEF}"
          publisher = "cohere"
          offer = "podvm"
          sku = "${IMAGE_DEF}"
          diskName = "${DISK_NAME}"

          [variant.default]
          provider = "azure"

          [variant.default.azure]
          replicationRegions = ["${LOCATION}"]
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/podvm/uplosi.conf

          echo "Uploading with uplosi (private gallery, ${ATTESTATION_VARIANT}):"
          cat /tmp/podvm/uplosi.conf

          cd /tmp/podvm
          uplosi upload disk.raw

          IMAGE_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Compute/galleries/${GALLERY}/images/${IMAGE_DEF}/versions/${IMAGE_VERSION}"
          echo "Published ${IMAGE_ID}"

          {
            echo "### PodVM Azure gallery image published"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Gallery | \`${GALLERY}\` |"
            echo "| Definition | \`${IMAGE_DEF}\` |"
            echo "| Version | \`${IMAGE_VERSION}\` |"
            echo "| Security type | ConfidentialVmSupported (${ATTESTATION_VARIANT}) |"
            echo "| TEE | ${TEE_PLATFORM} |"
            echo "| Image ID | \`${IMAGE_ID}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
